# Project Scout services on the Ubuntu box.
#
# Services:
#   agent  Claude Code on DeepSeek (profile "agent"), started by agent/run-session.sh
#   db     PostgreSQL (profile "scout"), always on, localhost only
#   scout  the scouting code (profile "scout"), run one command at a time:
#            docker compose --profile scout run --rm scout db check
#   digest the daily email (profile "scout"), same image, started by a timer
#
# Host folders live under SCOUT_HOME (default /srv/scout):
#   ${SCOUT_HOME}/secrets/deepseek.env   your DeepSeek key (mode 600, never in git)
#   ${SCOUT_HOME}/policy/                live locked settings + hook (root-owned)
#   ${SCOUT_HOME}/workspace/             the agent's only writable folder
#   ${SCOUT_HOME}/pgdata/                Postgres data (only the db container sees it)
#   ${SCOUT_HOME}/logs/workbc/           raw WorkBC responses from sweeps (scout writes, uid 10002)
#   ${SCOUT_HOME}/secrets/db-admin.env   Postgres superuser password (db only)
#   ${SCOUT_HOME}/secrets/db-roles.env   passwords for the four scout_* roles
#                                        (made by ops/db/make-secrets.sh)
#   ${SCOUT_HOME}/secrets/mail.env       Gmail address and app password (digest only;
#                                        made by ops/mail/make-mail-env.sh)
#
# The agent is on the default network and can't reach the database: db and scout
# share a separate "data" network. The agent gets database access only in Phase 3.
#
# The agent never starts on `docker compose up`; sessions are started by
# agent/run-session.sh with `docker compose run`.

name: scout

services:
  agent:
    build:
      context: ./agent
    image: scout-agent:dev
    profiles: ["agent"]

    user: "10001:10001"
    working_dir: /workspace

    # --- Hardening (plan §5.4, layer 1) ---
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/agent:size=256m,uid=10001,gid=10001,mode=0700
    mem_limit: 3g
    pids_limit: 512
    # No Docker socket, no host folders except these two:
    volumes:
      - ${SCOUT_HOME:-/srv/scout}/workspace:/workspace
      - ${SCOUT_HOME:-/srv/scout}/policy:/etc/claude-code:ro
    # Claude Code never needs Anthropic here; make sure it can't reach it.
    # Both IPv4 and IPv6, or lookups fall through to a real IPv6 address.
    extra_hosts:
      - "api.anthropic.com=0.0.0.0"
      - "api.anthropic.com=::1"
      - "statsig.anthropic.com=0.0.0.0"
      - "statsig.anthropic.com=::1"
      - "console.anthropic.com=0.0.0.0"
      - "console.anthropic.com=::1"
      - "claude.ai=0.0.0.0"
      - "claude.ai=::1"

    # --- DeepSeek via Claude Code (plan §5.1) ---
    env_file:
      - path: ${SCOUT_HOME:-/srv/scout}/secrets/deepseek.env
        required: true
    environment:
      ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
      ANTHROPIC_MODEL: deepseek-flash
      ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-flash
      ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-flash
      ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-flash
      CLAUDE_CODE_SUBAGENT_MODEL: deepseek-flash
      # DeepSeek's guide uses "max"; start low for cost, tune in the Phase 0 bake-off.
      CLAUDE_CODE_EFFORT_LEVEL: ${SCOUT_EFFORT:-low}
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      # Claude Code retries failed requests 10 times by default, including a 401
      # from DeepSeek: a bad key or empty balance then sits until the session
      # timeout. 3 still rides out a network blip; a bad key fails in seconds.
      CLAUDE_CODE_MAX_RETRIES: "3"
      DISABLE_AUTOUPDATER: "1"
      # ANTHROPIC_API_KEY must stay unset (auth conflict with ANTHROPIC_AUTH_TOKEN).
      # Identity for the agent's local commits (no remote, never pushed).
      GIT_AUTHOR_NAME: Scout Agent
      GIT_AUTHOR_EMAIL: scout-agent@localhost
      GIT_COMMITTER_NAME: Scout Agent
      GIT_COMMITTER_EMAIL: scout-agent@localhost
      SCOUT_GUARD_LOG: /workspace/.scout-logs/guard.log

  # --- Phase 1: database and scouting code (docs/phase1-plan.md) ---

  db:
    # Postgres 18 keeps its data under /var/lib/postgresql/18/docker, so the host
    # folder is mounted one level up (not at .../data as in older guides).
    image: postgres:18
    profiles: ["scout"]
    restart: unless-stopped
    env_file:
      - path: ${SCOUT_HOME:-/srv/scout}/secrets/db-admin.env
        required: true
      - path: ${SCOUT_HOME:-/srv/scout}/secrets/db-roles.env
        required: true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      SCOUT_DB_NAME: scout
    volumes:
      - ${SCOUT_HOME:-/srv/scout}/pgdata:/var/lib/postgresql
      # Runs once, on an empty data folder: database, schema and the four roles.
      - ./ops/db/initdb:/docker-entrypoint-initdb.d:ro
    # Localhost only: reach it from Windows through an SSH tunnel (plan §8).
    ports:
      - "127.0.0.1:5432:5432"
    networks: [data]
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    mem_limit: 1g
    healthcheck:
      # Over TCP on purpose: during first-time setup Postgres only listens on its
      # socket, so this stays "starting" until the roles and database exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d scout"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  scout:
    build:
      context: .
      target: runtime
    image: scout-runtime:dev
    profiles: ["scout"]
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 512m
    env_file:
      - path: ${SCOUT_HOME:-/srv/scout}/secrets/db-roles.env
        required: true
    environment:
      SCOUT_DB_HOST: db
      SCOUT_RAW_DIR: /data/workbc-raw
      SCOUT_RAW_DIR_HOST: ${SCOUT_HOME:-/srv/scout}/logs/workbc   # for messages only
    volumes:
      # The only host folder it can write: raw sweep responses, for debugging.
      - ${SCOUT_HOME:-/srv/scout}/logs/workbc:/data/workbc-raw
    networks: [data]
    depends_on:
      db:
        condition: service_healthy

  # The daily digest email (Phase 2). Same image as scout; the only service that gets the
  # email password. Reads Scout's logs folder (backup status, sync time) read-only.
  #   docker compose --profile scout run --rm digest digest --dry-run
  digest:
    image: scout-runtime:dev          # built by `docker compose --profile scout build scout`
    pull_policy: never
    profiles: ["scout"]
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    env_file:
      - path: ${SCOUT_HOME:-/srv/scout}/secrets/db-roles.env
        required: true
      # Not required, so the other services work before it exists; `scout digest` says
      # what's missing.
      - path: ${SCOUT_HOME:-/srv/scout}/secrets/mail.env
        required: false
    environment:
      SCOUT_DB_HOST: db
      SCOUT_LOGS_DIR: /data/logs
    volumes:
      - ${SCOUT_HOME:-/srv/scout}/logs:/data/logs:ro
    networks: [data]
    depends_on:
      db:
        condition: service_healthy

networks:
  data: {}
